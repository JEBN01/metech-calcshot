<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ME-Tech Calcshot</title>
<style>
:root{color-scheme:only light;--navy:#0a2a4a;--blue:#0b63b5;--sky:#0099d8;--soft:#eef5fb;--ink:#10263b;--muted:#5a6f82;--line:#d6e2ed;--red:#b3261e;--green:#1b7f4b;--amber:#b86e00;--f:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--soft);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
.nav{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;height:60px;display:flex;align-items:center;position:sticky;top:0;z-index:20}
.wm{height:24px;width:auto;color:var(--navy)}
.tl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-left:10px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:6px}
h1{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.015em;color:var(--navy)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:3px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}
.row{display:flex;gap:10px}
.row>*{flex:1}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=search],select{width:100%;border:1px solid var(--line);border-radius:3px;background:#fff;padding:12px 12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,153,216,.15)}
.empty{text-align:center;color:var(--muted);padding:44px 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:3px;font-size:14px;font-weight:500;z-index:80;display:none;max-width:90%}
.toast.on{display:block}
.view{display:none}.view.on{display:block}
</style>
</head>
